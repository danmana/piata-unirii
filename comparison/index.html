<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Three.js run comparison</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: #111; color: #eee; font: 14px system-ui, sans-serif; }
    header { display: flex; gap: 12px; align-items: center; padding: 10px 14px; border-bottom: 1px solid #333; }
    header strong { margin-right: auto; }
    main { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); height: calc(100% - 49px); }
    section { display: grid; grid-template-rows: auto 1fr; min-width: 0; border-right: 1px solid #333; }
    section:last-child { border: 0; }
    .bar { display: grid; grid-template-columns: minmax(150px, auto) minmax(0, 1fr) auto; gap: 10px; align-items: center; min-height: 42px; padding: 7px 10px; background: #1b1b1b; }
    select { min-width: 0; background: #292929; color: inherit; border: 1px solid #444; padding: 5px; }
    .meta { color: #aaa; font-size: 12px; }
    a { margin-left: auto; color: #9cc8ff; }
    iframe { width: 100%; height: 100%; border: 0; background: #222; }
    .empty { display: grid; place-items: center; color: #888; }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; grid-template-rows: repeat(2, minmax(0, 1fr)); } }
  </style>
</head>
<body>
  <header><strong>Run comparison</strong><span>Click a scene before using its keyboard controls.</span></header>
  <main id="comparison"></main>
  <script type="module">
    const root = document.querySelector('#comparison');
    const runs = await fetch('./runs.json').then(response => {
      if (!response.ok) throw new Error(`Could not load runs.json (${response.status})`);
      return response.json();
    });

    if (!runs.length) {
      root.className = 'empty';
      root.textContent = 'No runs yet.';
    } else {
      const formatStartedAt = value => {
        if (!value) return 'unknown';
        const date = new Date(value);
        return Number.isNaN(date.getTime())
          ? value
          : new Intl.DateTimeFormat(undefined, { dateStyle: 'medium', timeStyle: 'medium' }).format(date);
      };

      const formatDuration = value => {
        if (!Number.isFinite(value) || value < 0) return 'unknown';
        const total = Math.floor(value);
        const hours = Math.floor(total / 3600);
        const minutes = Math.floor((total % 3600) / 60);
        const seconds = total % 60;
        if (hours) return `${hours}h${minutes ? ` ${minutes}m` : ''}`;
        if (minutes) return `${minutes}m${seconds ? ` ${seconds}s` : ''}`;
        return `${seconds}s`;
      };

      const makePane = selectedIndex => {
        const section = document.createElement('section');
        section.innerHTML = '<div class="bar"><select></select><span class="meta"></span><a target="_blank" rel="noopener">Open</a></div><iframe></iframe>';
        const select = section.querySelector('select');
        const meta = section.querySelector('.meta');
        const link = section.querySelector('a');
        const frame = section.querySelector('iframe');

        runs.forEach((run, index) => select.add(new Option(run.name, index)));
        select.value = Math.min(selectedIndex, runs.length - 1);

        const show = () => {
          const run = runs[Number(select.value)];
          const src = `../runs/${encodeURIComponent(run.name)}/index.html`;
          const startedAt = formatStartedAt(run.startedAt);
          const duration = formatDuration(run.durationSeconds);
          meta.textContent = `${run.provider || 'Unknown provider'} · ${run.agent || 'Unknown agent'} · ${run.model} · ${run.effort} · started ${startedAt} · duration ${duration}`;
          link.href = src;
          frame.src = src;
          frame.title = run.name;
        };

        select.addEventListener('change', () => {
          show();
          syncUrl();
        });
        show();
        return section;
      };

      // ?vs=left,right — each side is a run name or a unique leading part of one (e.g. opus-5.5).
      const matches = key => runs.filter(run => run.name === key || run.name.startsWith(`${key}-`));
      const findIndex = key => {
        const exact = runs.findIndex(run => run.name === key);
        return exact >= 0 ? exact : runs.indexOf(matches(key)[0]);
      };
      const shortName = run => {
        const parts = run.name.split('-');
        let short = run.name;
        for (let length = parts.length - 1; length >= 2; length--) {
          const key = parts.slice(0, length).join('-');
          const found = matches(key);
          if (found.length !== 1 || found[0] !== run) break;
          short = key;
        }
        return short;
      };
      const syncUrl = () => {
        const selects = [...root.querySelectorAll('select')];
        const url = new URL(location.href);
        url.searchParams.set('vs', selects.map(select => shortName(runs[Number(select.value)])).join(','));
        history.replaceState(null, '', url.toString().replace(/%2C/g, ','));
      };
      const pick = (key, name, fallback) => {
        for (const candidate of [key, name]) {
          const index = candidate ? findIndex(candidate) : -1;
          if (index >= 0) return index;
        }
        return fallback;
      };
      const [left, right] = (new URLSearchParams(location.search).get('vs') || '').split(',');
      root.append(
        makePane(pick(left, 'opus-5.5-xhigh-01', 0)),
        makePane(pick(right, 'sonnet-5.5-xhigh-01', 1)),
      );
    }
  </script>
</body>
</html>
